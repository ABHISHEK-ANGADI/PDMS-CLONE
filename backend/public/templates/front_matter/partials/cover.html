<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM University - Curriculum Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =====================================================
           COVER PAGE - Flexible
           ===================================================== */

        .page {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 1024 / 1448;
            overflow: hidden;
            background: #ffffff;
            margin: 0 auto;
        }

        /* =====================================================
           COVER BACKGROUND IMAGE
           ===================================================== */

        .cover-bg {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            z-index: 0;
        }

        /* =====================================================
           ALL CONTENT ABOVE BACKGROUND
           ===================================================== */

        .university,
        .curriculum,
        .scheme,
        .semester,
        .btech,
        .in,
        .course,
        .logo,
        .school,
        .year {
            z-index: 2;
            position: absolute;
        }

        /* =====================================================
           TEXT WRAPPING - PREVENT OVERFLOW FOR ALL TEXT
           ===================================================== */

        .university,
        .curriculum,
        .scheme,
        .semester,
        .btech,
        .in,
        .course,
        .school,
        .year {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            max-width: 80%;
        }

        /* =====================================================
           GM UNIVERSITY - Top Centered
           ===================================================== */

        .university {
            top: 8%;
            left: 69%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 70%;
            text-align: center;
            color: #5a1719;
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 700;
            letter-spacing: 3px;
        }

        /* =====================================================
           CURRICULUM DOCUMENT
           ===================================================== */

        .curriculum {
            top: 16%;
            left: 69%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 70%;
            text-align: center;
            color: #5a1719;
            font-size: clamp(28px, 4.5vw, 44px);
            font-weight: 700;
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-underline-offset: 12px;
        }

        /* =====================================================
           2026 SCHEME
           ===================================================== */

        .scheme {
            top: 23%;
            left: 70%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 70%;
            text-align: center;
            color: #5a1719;
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 700;
        }

        /* =====================================================
           SEMESTER
           ===================================================== */

        .semester {
            top: 30%;
            left: 70%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 70%;
            text-align: center;
            color: #5a1719;
            font-size: clamp(24px, 3.8vw, 38px);
            font-weight: 700;
        }

        /* =====================================================
           B.TECH - Left side
           ===================================================== */

        .btech {
            top: 39%;
            left: 55%;
            width: 180px;
            max-width: 25%;
            text-align: right;
            color: #5a1719;
            font-size: clamp(20px, 3.2vw, 34px);
            font-weight: 400;
        }

        /* =====================================================
           IN - Center
           ===================================================== */

        .in {
            top: 44%;
            left: 72%;
            transform: translateX(-50%);
            width: auto;
            max-width: 20%;
            text-align: center;
            color: #5a1719;
            font-size: clamp(18px, 2.8vw, 28px);
            font-weight: 400;
        }

        /* =====================================================
           COURSE NAME - Right side with wrapping
           ===================================================== */

        .course {
            top: 48%;
            right: -4%;
            width: 420px;
            max-width: 55%;
            text-align: left;
            color: #5a1719;
            font-size: clamp(22px, 3.5vw, 36px);
            font-weight: 700;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .course .indent {
            padding-left: 60px;
            display: inline-block;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        /* =====================================================
           GM UNIVERSITY LOGO - Bottom left
           ===================================================== */

        .logo {
            left: 4%;
            bottom: 40%;
            width: clamp(150px, 24vw, 250px);
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* =====================================================
           SCHOOL / FACULTY - Bottom centered
           ===================================================== */

        .school {
            left: 30%;
            transform: translateX(-50%);
            bottom: 30%;
            width: 700px;
            max-width: 70%;
            text-align: center;
            color: #e4a92b;
            font-size: clamp(18px, 2.6vw, 24px);
            line-height: 1.5;
            font-weight: 300;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        /* =====================================================
           YEAR - Bottom right
           ===================================================== */

        .year {
            right: 6%;
            bottom: 4%;
            color: #e4a92b;
            font-size: clamp(20px, 3vw, 30px);
            letter-spacing: 8px;
            font-weight: 400;
            white-space: nowrap;
            max-width: 40%;
        }

        .year::before,
        .year::after {
            content: "";
            display: inline-block;
            width: clamp(30px, 5vw, 50px);
            height: 2px;
            background: #e4a92b;
            vertical-align: middle;
            margin: 0 12px;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 768px) {
            .university {
                max-width: 75%;
                font-size: clamp(24px, 4vw, 36px);
                top: 8%;
                left: 65%;
            }

            .curriculum {
                max-width: 75%;
                font-size: clamp(20px, 3.5vw, 32px);
                top: 16%;
                left: 65%;
            }

            .scheme {
                max-width: 75%;
                font-size: clamp(18px, 3vw, 28px);
                top: 23%;
                left: 65%;
            }

            .semester {
                max-width: 75%;
                font-size: clamp(16px, 2.8vw, 26px);
                top: 30%;
                left: 65%;
            }

            .btech {
                left: 10%;
                width: 120px;
                max-width: 30%;
                font-size: clamp(16px, 2.5vw, 24px);
            }

            .course {
                right: 10%;
                width: 280px;
                max-width: 55%;
                font-size: clamp(16px, 2.5vw, 24px);
            }

            .course .indent {
                padding-left: 40px;
            }

            .in {
                font-size: clamp(14px, 2vw, 20px);
                top: 41%;
                max-width: 25%;
                left: 65%;
            }

            .logo {
                width: clamp(100px, 18vw, 180px);
                bottom: 25%;
            }

            .school {
                font-size: clamp(14px, 2vw, 20px);
                bottom: 14%;
                max-width: 75%;
                left: 25%;
            }

            .year {
                font-size: clamp(14px, 2.5vw, 22px);
                right: 5%;
                bottom: 4%;
                letter-spacing: 4px;
                max-width: 50%;
                white-space: nowrap;
            }

            .year::before,
            .year::after {
                width: clamp(20px, 3vw, 30px);
                margin: 0 8px;
            }
        }

        @media (max-width: 480px) {
            .university {
                max-width: 80%;
                font-size: clamp(18px, 3vw, 24px);
                top: 8%;
                left: 60%;
            }

            .curriculum {
                max-width: 80%;
                font-size: clamp(16px, 2.5vw, 20px);
                top: 16%;
                left: 60%;
            }

            .scheme {
                max-width: 80%;
                font-size: clamp(14px, 2.2vw, 18px);
                top: 23%;
                left: 60%;
            }

            .semester {
                max-width: 80%;
                font-size: clamp(12px, 2vw, 16px);
                top: 30%;
                left: 60%;
            }

            .btech {
                left: 5%;
                width: 80px;
                max-width: 35%;
                font-size: clamp(12px, 2vw, 16px);
                top: 42%;
            }

            .course {
                right: 5%;
                width: 180px;
                max-width: 60%;
                font-size: clamp(12px, 2vw, 16px);
                top: 42%;
            }

            .course .indent {
                padding-left: 25px;
            }

            .in {
                font-size: clamp(10px, 1.5vw, 14px);
                top: 43%;
                max-width: 30%;
                left: 60%;
            }

            .logo {
                width: clamp(60px, 12vw, 100px);
                bottom: 28%;
                left: 3%;
            }

            .school {
                font-size: clamp(10px, 1.5vw, 14px);
                bottom: 16%;
                max-width: 80%;
                left: 20%;
            }

            .year {
                font-size: clamp(12px, 2vw, 16px);
                right: 3%;
                bottom: 3%;
                letter-spacing: 2px;
                max-width: 55%;
                white-space: nowrap;
            }

            .year::before,
            .year::after {
                width: clamp(15px, 2vw, 20px);
                margin: 0 5px;
            }
        }
    </style>
</head>
<body>

    <div class="page">

        <!-- COVER BACKGROUND -->
        <img src="./images/coverpage.png" class="cover-bg" alt="Cover Background">

        <!-- GM UNIVERSITY - Centered -->
        <div class="university">GM UNIVERSITY</div>

        <!-- CURRICULUM DOCUMENT - Centered -->
        <div class="curriculum">Curriculum Document</div>

        <!-- 2026 SCHEME - Centered -->
        <div class="scheme">2026 Scheme</div>

        <!-- SEMESTER - Centered -->
        <div class="semester">I – VIII Semester</div>

        <!-- B.TECH - Left side -->
        <div class="btech">B.Tech.</div>

        <!-- IN - Center -->
        <div class="in">in</div>

        <!-- COURSE - Right side -->
        <div class="course">computer science and<br><span class="indent">Engineering</span></div>

        <!-- GM UNIVERSITY LOGO -->
        <img src="./images/gmulogo.png" class="logo" alt="GM University Logo">

        <!-- SCHOOL / FACULTY -->
        <div class="school">
            School of Computer Science &amp; Technology<br>
            Faculty of Engineering &amp; Technology
        </div>

        <!-- YEAR -->
        <div class="year">2026</div>

    </div>

</body>
</html>
